<!-- Storage Availability tab for the Custom Tabs plugin. -->
<!-- Paste this into Dashboard -> Plugins -> Custom Tabs -> (your tab) -> Content. -->

<!-- IMPORTANT: the iframe src below MUST be a full absolute URL (scheme + host + port), -->
<!-- not a relative path like "/StorageStats/Page". Native apps (Android/iOS/TV) render -->
<!-- Custom Tabs content in a context that doesn't share Jellyfin's own origin, so a -->
<!-- relative path silently resolves to nothing and the tab shows blank there, even -->
<!-- though it works fine in a desktop browser. Replace the address below with whatever -->
<!-- URL you'd normally use to reach this Jellyfin server (the same one your existing -->
<!-- Jellyseerr button uses an absolute URL for, for the same reason). -->

<style>
    .storage-stats-tab {
        text-align: center;
        padding: 20px;
    }

    .storage-stats-tab iframe {
        width: 100%;
        max-width: 460px;
        height: 380px;
        border: none;
        background: transparent;
    }

    @media (max-width: 990px) {
        .storage-stats-tab iframe {
            max-width: 100%;
            height: 400px;
        }
    }
</style>

<div class="storage-stats-tab">
    <iframe src="http://skwatch85.duckdns.org:8096/StorageStats/Page" title="Storage Availability"></iframe>
</div>
